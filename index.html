<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#050505" />
  <title>PSK HOSTEL — Not Just a Hostel</title>
  <meta name="description" content="PSK Hostel — not just a hostel. It's a way of life." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <main class="hero" id="home" aria-label="PSK Hostel cinematic homepage">
    <div class="memory-stage" aria-hidden="true">
      <div class="memory memory--back" data-memory="0">
        <img src="assets/memory-01.png" alt="" fetchpriority="high" />
      </div>
      <div class="memory memory--mid" data-memory="1">
        <img
          src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=2400&q=88"
          alt=""
        />
      </div>
      <div class="memory memory--front" data-memory="2">
        <img
          src="https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=2400&q=88"
          alt=""
        />
      </div>
    </div>

    <div class="cinema-overlay"></div>
    <div class="edge-vignette"></div>
    <div class="grain"></div>

    <header class="site-header">
      <a class="brand-mark" href="#home" aria-label="PSK Hostel home">P</a>

      <nav class="nav" aria-label="Primary navigation">
        <a class="nav__link is-active" href="#home">Home</a>
        <a class="nav__link" href="#memories">Memories</a>
        <a class="nav__link" href="#places">Places</a>
        <a class="nav__link" href="#story">Our Story</a>
        <a class="nav__link" href="#contact">Contact</a>
      </nav>

      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span>
      </button>
    </header>

    <section class="title-lockup" aria-label="PSK Hostel">
      <h1 class="title">
        <span>PSK</span>
        <span>HOSTEL</span>
      </h1>
      <div class="title-rule"></div>
      <p class="tagline">
        <span>NOT JUST A HOSTEL.</span>
        <span>IT'S A WAY OF LIFE.</span>
      </p>
    </section>

    <a class="scroll-cue" href="#memories" aria-label="Scroll to memories">
      <span></span>
    </a>

    <div class="mobile-menu" aria-hidden="true">
      <a href="#home">Home</a>
      <a href="#memories">Memories</a>
      <a href="#places">Places</a>
      <a href="#story">Our Story</a>
      <a href="#contact">Contact</a>
    </div>
  </main>

  <section id="memories" class="stub-section">
    <span>Memories</span>
  </section>
  <section id="places" class="stub-section">
    <span>Places</span>
  </section>
  <section id="story" class="stub-section">
    <span>Our Story</span>
  </section>
  <section id="contact" class="stub-section">
    <span>Contact</span>
  </section>

  <script src="script.js"></script>
</body>
</html>
